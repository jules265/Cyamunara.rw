<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cyamunara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
        }

        body {
            background-color: var(--light-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        .auth-row {
            display: flex;
            min-height: 600px;
        }

        .auth-image {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .auth-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .social-login {
            margin-top: 20px;
            text-align: center;
        }

        .btn-google {
            background-color: #db4437;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin-top: 10px;
        }

        .btn-google:hover {
            background-color: #c23321;
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
        }

        .switch-form a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: var(--secondary-color);
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        @media (max-width: 768px) {
            .auth-image {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-row">
                <div class="auth-image">
                    <h2>Welcome to Cyamunara</h2>
                    <p>Your trusted platform for online auctions and property bidding.</p>
                    <img src="assets/auction-illustration.svg" alt="Auction Illustration" style="max-width: 80%; margin: 20px auto;">
                </div>
                <div class="auth-form">
                    <!-- Login Form -->
                    <div id="loginForm">
                        <h2 class="form-title">Login to Your Account</h2>
                        <form id="login">
                            <div class="mb-3">
                                <input type="email" class="form-control" id="loginEmail" placeholder="Email Address" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                                <a href="#" class="float-end" onclick="showForgotPassword()">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                            <div class="error-message" id="loginError"></div>
                        </form>
                        <div class="social-login">
                            <p>Or login with</p>
                            <button class="btn btn-google" onclick="signInWithGoogle()">
                                <i class="bi bi-google"></i> Continue with Google
                            </button>
                        </div>
                        <div class="switch-form">
                            <p>Don't have an account? <a href="#" onclick="toggleForms()">Register Now</a></p>
                        </div>
                    </div>

                    <!-- Register Form -->
                    <div id="registerForm" style="display: none;">
                        <h2 class="form-title">Create an Account</h2>
                        <form id="register">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="registerName" placeholder="Full Name" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" id="registerEmail" placeholder="Email Address" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="termsAccept" required>
                                <label class="form-check-label" for="termsAccept">
                                    I accept the <a href="#">Terms and Conditions</a>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                            <div class="error-message" id="registerError"></div>
                        </form>
                        <div class="switch-form">
                            <p>Already have an account? <a href="#" onclick="toggleForms()">Login</a></p>
                        </div>
                    </div>

                    <!-- Forgot Password Form -->
                    <div id="forgotPasswordForm" style="display: none;">
                        <h2 class="form-title">Reset Password</h2>
                        <form id="resetPassword">
                            <div class="mb-3">
                                <input type="email" class="form-control" id="resetEmail" placeholder="Email Address" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                            <div class="error-message" id="resetError"></div>
                        </form>
                        <div class="switch-form">
                            <p><a href="#" onclick="showLoginForm()">Back to Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCS024K6CozcOvOLHMou9dKsNDh-fCw10c",
            authDomain: "usermanagr.firebaseapp.com",
            projectId: "usermanagr",
            storageBucket: "usermanagr.appspot.com",
            messagingSenderId: "201891796617",
            appId: "1:201891796617:web:ab31f6c5b0e1becb6bd858",
            measurementId: "G-WPNMDSTYXZ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Toggle between login and register forms
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                forgotPasswordForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                forgotPasswordForm.style.display = 'none';
            }
        }

        // Show forgot password form
        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
        }

        // Show login form
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'none';
        }

        // Handle login form submission
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorElement = document.getElementById('loginError');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Check if user is admin
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data();

                if (userData?.isAdmin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                errorElement.style.display = 'block';
                errorElement.textContent = error.message;
            }
        });

        // Handle registration form submission
        document.getElementById('register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorElement = document.getElementById('registerError');

            if (password !== confirmPassword) {
                errorElement.style.display = 'block';
                errorElement.textContent = 'Passwords do not match';
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isAdmin: false
                });

                // Update profile
                await user.updateProfile({
                    displayName: name
                });

                window.location.href = 'index.html';
            } catch (error) {
                errorElement.style.display = 'block';
                errorElement.textContent = error.message;
            }
        });

        // Handle password reset
        document.getElementById('resetPassword').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const errorElement = document.getElementById('resetError');

            try {
                await auth.sendPasswordResetEmail(email);
                alert('Password reset email sent! Please check your inbox.');
                showLoginForm();
            } catch (error) {
                errorElement.style.display = 'block';
                errorElement.textContent = error.message;
            }
        });

        // Google Sign In
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(async (result) => {
                    const user = result.user;
                    
                    // Check if user document exists
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        // Create new user document
                        await db.collection('users').doc(user.uid).set({
                            name: user.displayName,
                            email: user.email,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            isAdmin: false
                        });
                    }

                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    const errorElement = document.getElementById('loginError');
                    errorElement.style.display = 'block';
                    errorElement.textContent = error.message;
                });
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
