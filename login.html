<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cyamunara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
        }

        .auth-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            margin: 2rem;
        }

        .auth-row {
            display: flex;
            min-height: 600px;
        }

        .auth-image {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            padding: 40px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .auth-image h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .auth-image p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .auth-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--dark-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        .form-control {
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            width: 100%;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(13, 138, 114, 0.1);
        }

        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
        }

        .auth-links a:hover {
            color: var(--accent-color);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .auth-card {
                margin: 1rem;
            }

            .auth-row {
                flex-direction: column;
                min-height: auto;
            }

            .auth-image {
                padding: 2rem;
            }

            .auth-image h2 {
                font-size: 2rem;
            }

            .auth-form {
                padding: 2rem;
            }

            .form-title {
                font-size: 1.8rem;
                margin-bottom: 1.5rem;
            }
        }

        @media screen and (max-width: 480px) {
            .auth-card {
                margin: 0.5rem;
            }

            .auth-image {
                padding: 1.5rem;
            }

            .auth-image h2 {
                font-size: 1.5rem;
            }

            .auth-form {
                padding: 1.5rem;
            }

            .form-title {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Initial loading state -->
        <div id="initialLoading" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>

        <div id="mainContent" class="d-none">
            <div class="auth-card">
                <div class="auth-row">
                    <div class="auth-image">
                        <h2>Welcome to Cyamunara</h2>
                        <p>Your trusted platform for online auctions and property bidding.</p>
                        <img src="assets/auction-illustration.svg" alt="Auction Illustration" style="max-width: 80%; margin: 20px auto;">
                    </div>
                    <div class="auth-form">
                        <!-- Login Form -->
                        <div id="loginForm">
                            <h2 class="form-title">Login to Your Account</h2>
                            <form id="login">
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" id="password" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                                        <span id="loginButtonText">Login</span>
                                        <span id="loginSpinner" class="spinner" style="display: none;"></span>
                                    </button>
                                </div>
                                <div class="auth-links">
                                    <a href="#" id="forgotPassword">Forgot Password?</a>
                                    <p style="margin-top: 1rem;">Don't have an account? <a href="#" id="showRegister">Sign Up</a></p>
                                </div>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div id="registerForm" style="display: none;">
                            <h2 class="form-title">Create an Account</h2>
                            <form id="register">
                                <div class="form-group">
                                    <label for="registerName">Full Name</label>
                                    <input type="text" id="registerName" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="registerEmail">Email Address</label>
                                    <input type="email" id="registerEmail" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="registerPassword">Password</label>
                                    <input type="password" id="registerPassword" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <input type="password" id="confirmPassword" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                                        <span id="registerButtonText">Create Account</span>
                                        <span id="registerSpinner" class="spinner" style="display: none;"></span>
                                    </button>
                                </div>
                                <div class="auth-links">
                                    <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
                                </div>
                            </form>
                        </div>

                        <!-- Alert Container -->
                        <div id="alertContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCS024K6CozcOvOLHMou9dKsNDh-fCw10c",
            authDomain: "usermanagr.firebaseapp.com",
            projectId: "usermanagr",
            storageBucket: "usermanagr.appspot.com",
            messagingSenderId: "201891796617",
            appId: "1:201891796617:web:ab31f6c5b0e1becb6bd858",
            measurementId: "G-WPNMDSTYXZ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check authentication state
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'profile2.html';
            } else {
                document.getElementById('initialLoading').style.display = 'none';
                document.getElementById('mainContent').classList.remove('d-none');
            }
        });

        // Form switching functions
        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        // Login form submission
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginButton = e.target.querySelector('button');
            const loginButtonText = document.getElementById('loginButtonText');
            const loginSpinner = document.getElementById('loginSpinner');

            try {
                loginButton.disabled = true;
                loginButtonText.style.display = 'none';
                loginSpinner.style.display = 'inline-block';

                await auth.signInWithEmailAndPassword(email, password);
                // Redirect will happen automatically through onAuthStateChanged
            } catch (error) {
                console.error('Login error:', error);
                showAlert('error', 'Login failed: ' + error.message);
                loginButton.disabled = false;
                loginButtonText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        });

        // Register form submission
        document.getElementById('register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const fullName = document.getElementById('registerName').value;

            const registerButton = e.target.querySelector('button');
            const registerButtonText = document.getElementById('registerButtonText');
            const registerSpinner = document.getElementById('registerSpinner');

            if (password !== document.getElementById('confirmPassword').value) {
                showAlert('error', 'Passwords do not match');
                return;
            }

            try {
                registerButton.disabled = true;
                registerButtonText.style.display = 'none';
                registerSpinner.style.display = 'inline-block';

                // Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    fullName: fullName,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Update profile display name
                await user.updateProfile({
                    displayName: fullName
                });

                showAlert('success', 'Registration successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'profile2.html';
                }, 1500);
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('error', 'Registration failed: ' + error.message);
                registerButton.disabled = false;
                registerButtonText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        });

        // Password reset
        document.getElementById('forgotPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            if (!email) {
                showAlert('error', 'Please enter your email address');
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                showAlert('success', 'Password reset email sent. Please check your inbox.');
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('error', 'Password reset failed: ' + error.message);
            }
        });

        // Alert helper function
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type === 'error' ? 'danger' : 'success'} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="bi ${type === 'error' ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill'}"></i>
                ${message}
                <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
            `;
            alertContainer.appendChild(alert);

            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
    </script>
</body>
</html>
