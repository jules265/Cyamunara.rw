<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Product - Cyamunara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-method-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .payment-method-card:hover {
            border-color: #007bff;
        }
        .payment-method-card.selected {
            border-color: #007bff;
            background-color: #f8f9fa;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <!-- Product Display Section -->
            <div class="col-md-5">
                <div class="card">
                    <img src="product-image.jpg" class="product-image" alt="Product Image">
                    <div class="card-body">
                        <h3 class="card-title" id="product-name">Product Name</h3>
                        <p class="card-text" id="product-description">Product description will be displayed here.</p>
                        <h4 class="text-primary" id="product-price">RWF 0.00</h4>
                    </div>
                </div>
            </div>

            <!-- Payment Form Section -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-4">Payment Information</h3>
                        <form id="payment-form">
                            <!-- Personal Information -->
                            <div class="mb-4">
                                <h5>Personal Details</h5>
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" required>
                                </div>
                            </div>

                            <!-- Payment Methods -->
                            <div class="mb-4">
                                <h5>Select Payment Method</h5>
                                
                                <!-- PayPal -->
                                <div class="payment-method-card" onclick="selectPayment('paypal')">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="paymentMethod" value="paypal" required>
                                        <label class="form-check-label">
                                            <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg" alt="PayPal" height="23">
                                            PayPal
                                        </label>
                                    </div>
                                </div>

                                <!-- BK Bank -->
                                <div class="payment-method-card" onclick="selectPayment('bk')">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="paymentMethod" value="bk" required>
                                        <label class="form-check-label">
                                            BK Bank Transfer
                                        </label>
                                    </div>
                                </div>

                                <!-- MoMoPay Section -->
                                <div class="payment-method-card" onclick="selectPayment('momo')">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="paymentMethod" value="momo" required>
                                        <label class="form-check-label">
                                            MoMoPay
                                        </label>
                                    </div>
                                    <div class="mt-2" id="momo-options" style="display: none;">
                                        <select class="form-select">
                                            <option value="">Select Provider</option>
                                            <option value="mtn">MTN Mobile Money</option>
                                            <option value="airtel">Airtel Money</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Proceed to Payment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load the selected product when the page loads
        window.addEventListener('DOMContentLoaded', function() {
            const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));
            if (selectedProduct) {
                document.getElementById('product-name').textContent = selectedProduct.title;
                document.getElementById('product-description').textContent = selectedProduct.description;
                document.getElementById('product-price').textContent = `RWF ${selectedProduct.price}`;
                const productImage = document.querySelector('.product-image');
                productImage.src = selectedProduct.image || '/api/placeholder/400/300';
                productImage.alt = selectedProduct.title;
            }
        });

        function selectPayment(method) {
            // Remove selected class from all cards
            document.querySelectorAll('.payment-method-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selected class to clicked card
            const selectedCard = document.querySelector(`.payment-method-card:has(input[value="${method}"])`);
            selectedCard.classList.add('selected');
            
            // Select the radio button
            const radio = selectedCard.querySelector('input[type="radio"]');
            radio.checked = true;
            
            // Show/hide MoMo options
            const momoOptions = document.getElementById('momo-options');
            momoOptions.style.display = method === 'momo' ? 'block' : 'none';
        }

        document.getElementById('payment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));
            const formData = new FormData(this);
            
            // Create order object
            const order = {
                product: selectedProduct,
                customerName: formData.get('fullName'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                paymentMethod: formData.get('paymentMethod'),
                orderDate: new Date().toISOString(),
                status: 'pending'
            };

            // Save order to localStorage
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // Add to cart
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(selectedProduct);
            localStorage.setItem('cart', JSON.stringify(cart));

            // Clear selected product
            localStorage.removeItem('selectedProduct');

            // Redirect to cart page
            window.location.href = 'cart.html';
        });
    </script>
</body>
</html>
